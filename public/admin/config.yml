# Sveltia CMS configuration — https://sveltiacms.app/en/docs
#
# Every editable area is a JSON file under src/data/, read by the page
# components at build time. Saving in the CMS commits that file to the
# branch below; Netlify rebuilds the site from the commit.
#
# Sign-in: GitHub, through Netlify's built-in OAuth provider (no
# base_url needed when the site is hosted on Netlify). On localhost,
# choose "Work with Local Repository" instead to edit the files on disk.
backend:
  name: github
  repo: CLFACollective/Website2CLFA
  # the branch Netlify deploys — each save is a production deploy
  branch: main

media_folder: public/img/uploads
public_folder: /img/uploads

collections:
  # ---------------------------------------------------------- Site-wide
  - name: site
    label: Site-wide
    icon: menu
    editor:
      preview: false
    files:
      - name: navigation
        label: Menu & footer links
        file: src/data/navigation.json
        format: json
        fields:
          - name: links
            label: Pages
            label_singular: Page
            collapsed: true
            widget: list
            summary: "{{fields.menuLabel}} — {{fields.href}}"
            hint: >-
              One list feeds both the menu and the footer. Drag to reorder;
              the menu's 01, 02… numbers follow the order. A new page is
              built by a developer first — then add its link here.
            fields:
              - name: href
                label: Page address
                widget: string
                hint: "The part after the domain, e.g. /about"
                pattern: ["^/[a-z0-9\\-/]*$", "Start with / and use lowercase letters, numbers, and dashes, e.g. /about"]
              - { name: menuLabel, label: Menu label, widget: string, hint: The big link in the full-screen menu. }
              - { name: footerLabel, label: Footer label, widget: string, required: false, hint: Optional. Leave blank to reuse the menu label. }
              - { name: inMenu, label: Show in menu, widget: boolean, default: true, required: false }
              - { name: inFooter, label: Show in footer, widget: boolean, default: true, required: false }
          - name: linkedin
            label: LinkedIn URL
            widget: string
            hint: Used by the LinkedIn links in the menu, footer, and Contact page.
            pattern: ["^https://", "Use the full address, starting with https://"]

  # ---------------------------------------------------------------- Home
  - name: home
    label: Home page
    icon: home
    editor:
      preview: false
    files:
      - name: home
        label: Intro & client marquee
        file: src/data/home.json
        format: json
        fields:
          - name: intro
            label: "Intro paragraph (\"We're a highly experienced…\")"
            widget: text
            hint: Wrap words in **double asterisks** to make them bold.
          - name: vendors
            label: Client marquee ("Who tags us in.")
            label_singular: Client
            widget: list
            hint: Drag to reorder. Both marquee rows use this list.
            field:
              name: name
              label: Client name
              widget: string

      - name: cards
        label: Brand in motion cards
        file: src/data/cards.json
        format: json
        fields:
          - name: cards
            label: Cards
            label_singular: Card
            collapsed: true
            widget: list
            min: 1
            max: 5
            summary: "{{fields.text}}"
            hint: Up to 5 cards. Drag to reorder — they fan out in this order.
            fields:
              - name: text
                label: Text
                widget: text
                hint: >-
                  Wrap words in *single asterisks* for the copper italic
                  (e.g. *Pivoting*). Press Enter for a line break.
              - name: icon
                label: Icon
                widget: select
                options:
                  - { label: "Speed (dots)", value: speed }
                  - { label: "Acquired (linked rings)", value: acquired }
                  - { label: "Launch (burst)", value: launch }
                  - { label: "Merge (branches)", value: merge }
                  - { label: "Pivot (orbit)", value: pivot }
              - name: color
                label: Card colour
                widget: select
                default: light
                options:
                  - { label: Light blue, value: light }
                  - { label: Forest green, value: forest }
                  - { label: Slate blue, value: azure }
                  - { label: Charcoal, value: charcoal }

      - name: ribbon
        label: Ribbon Section
        file: src/data/ribbon.json
        format: json
        fields:
          - name: phrases
            label: Ribbon words
            widget: text
            hint: >-
              Separate each block with a semicolon ( ; ). All three ribbons
              show the same words, with a dot between each block —
              e.g. Ready to launch?; Mid-merger?; Pivoting?

      - name: momentum
        label: Momentum cards
        file: src/data/momentum.json
        format: json
        fields:
          - name: cards
            label: Cards
            label_singular: Card
            collapsed: true
            widget: list
            hint: >-
              They play in this order. While the cards follow the original
              pattern (short quote, three stats, long quote) the final screen
              uses the designed layout; any other set is laid out on an even grid.
            types:
              - name: stat
                label: Stat
                summary: "{{fields.prefix}}{{fields.value}}{{fields.suffix}} — {{fields.caption}}"
                fields:
                  - { name: prefix, label: Before the number, widget: string, required: false, hint: "e.g. $" }
                  - { name: value, label: Number, widget: number, value_type: int, min: 0, hint: Counts up from 0. }
                  - { name: suffix, label: After the number, widget: string, required: false, hint: "e.g. %, M, +" }
                  - { name: caption, label: Caption, widget: string }
                  - { name: captionEmphasis, label: Copper italic, widget: boolean, default: true, required: false }
                  - { name: subline, label: Line below, widget: text, hint: Press Enter for a line break. }
                  - { name: sublineEmphasis, label: Copper italic, widget: boolean, default: false, required: false }
              - name: quote
                label: Quote
                summary: "{{fields.attribution}}"
                fields:
                  - name: size
                    label: Size
                    widget: select
                    default: short
                    options:
                      - { label: "Short — a few big lines", value: short }
                      - { label: "Long — a paragraph", value: long }
                  - name: lines
                    label: Lines
                    label_singular: Line
                    widget: list
                    summary: "{{fields.text}}"
                    hint: >-
                      The quote mark sits after the first line. Press Enter inside
                      a line to add a break that only shows on phones.
                    fields:
                      - { name: text, label: Text, widget: text }
                      - { name: emphasis, label: Copper italic, widget: boolean, default: false, required: false }
                  - { name: attribution, label: Attribution, widget: string }

  # ---------------------------------------------------------- What We Do
  - name: what_we_do
    label: What We Do page
    icon: work
    editor:
      preview: false
    files:
      - name: services
        label: Services accordion
        file: src/data/services.json
        format: json
        fields:
          - name: services
            label: Services
            label_singular: Service
            collapsed: true
            widget: list
            summary: "{{fields.title}}"
            hint: Drag to reorder — the 01, 02… numbers follow the order automatically.
            fields:
              - { name: title, label: Title, widget: string }
              - { name: word, label: Big display word, widget: string, hint: "Shown huge in the open panel after the number, e.g. STRATEGY." }
              - name: icon
                label: Icon
                widget: image
                media_folder: /public/icons/services
                public_folder: /icons/services
              - { name: body, label: Description, widget: text }
              - name: iconScale
                label: Icon size
                widget: number
                value_type: float
                required: false
                min: 0.5
                max: 3
                step: 0.1
                hint: Optional. 1 is normal; raise it for an icon that looks small.

  # ---------------------------------------------------------------- FAQs
  - name: faqs
    label: FAQs page
    icon: quiz
    editor:
      preview: false
    files:
      - name: faqs
        label: Questions
        file: src/data/faqs.json
        format: json
        fields:
          - name: groups
            label: Groups
            label_singular: Group
            collapsed: true
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Group heading, widget: string }
              - name: items
                label: Questions
                label_singular: Question
                collapsed: true
                widget: list
                summary: "{{fields.question}}"
                hint: Drag to reorder.
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: lead, label: Bold opening, widget: string, required: false, hint: Optional bold words at the start of the answer. }
                  - { name: answer, label: Answer, widget: text, hint: Leave a blank line between paragraphs. }
                  - { name: tail, label: Bold closing line, widget: string, required: false }
